name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dtp_user
          POSTGRES_PASSWORD: dtp_password
          POSTGRES_DB: dtp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://dtp_user:dtp_password@localhost:5432/dtp_test_db
          TEST_DATABASE_URL: postgresql+psycopg://dtp_user:dtp_password@localhost:5432/dtp_test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-32-chars-long-minimum-requirement
          OTEL_ENABLED: "false"
        run: |
          pytest -v

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Typecheck TypeScript
        working-directory: frontend
        run: pnpm typecheck

      - name: Run Unit Tests
        working-directory: frontend
        run: pnpm test

      - name: Build Production Bundle
        working-directory: frontend
        run: pnpm build

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
